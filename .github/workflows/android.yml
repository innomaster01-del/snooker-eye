name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Syntax check web app
        run: |
          for f in app/src/main/assets/www/js/*.js; do node --check --input-type=module < "$f" || exit 1; done

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Build APK
        run: gradle --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SnookerEye-v1.0.${GITHUB_RUN_NUMBER}.apk"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: SnookerEye-apk
          path: out/*.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" out/*.apk --title "Snooker Eye $TAG" --notes "APK להתקנה ישירה בטלפון אנדרואיד. הורד את הקובץ ופתח אותו בטלפון."
